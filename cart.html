<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Vedam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .header {
      background: #57131A;
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 28px; }
    .logout-btn {
      background: white;
      color: #57131A;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .cart-section { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #eee;
    }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; font-size: 16px; margin-bottom: 5px; }
    .item-price { color: #666; }
    .item-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .quantity { width: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .delete-btn {
      background: #d32f2f;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    .delete-btn:hover { background: #b71c1c; }
    .empty-message {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .summary {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid #eee;
      text-align: right;
    }
    .total { font-size: 20px; font-weight: 600; color: #57131A; }
    .checkout-btn {
      background: #57131A;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    .checkout-btn:hover { background: #8B2635; }
    .add-item-form {
      background: #f9f9f9;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    .add-btn {
      background: #388e3c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .add-btn:hover { background: #2e7d32; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Your Cart</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="cart-section">
      <h2 style="margin-bottom: 20px;">Add Item to Cart</h2>
      <div class="add-item-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="productName" placeholder="e.g., Red Shirt">
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" id="productPrice" placeholder="e.g., 29.99" step="0.01">
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" id="productQty" value="1" min="1">
        </div>
        <button class="add-btn" onclick="addToCart()">Add to Cart</button>
      </div>

      <h2 style="margin-bottom: 20px;">Cart Items</h2>
      <div id="cartContainer">
        <div class="empty-message">Your cart is empty</div>
      </div>

      <div class="summary" id="summary" style="display: none;">
        <div class="total">Total: $<span id="totalPrice">0.00</span></div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, collection, addDoc, query, where, getDocs, deleteDoc, doc, signOut, onAuthStateChanged } from './firebase-config.js';

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'auth.html';
      } else {
        currentUser = user;
        loadCart();
      }
    });

    window.logout = async () => {
      await signOut(auth);
      window.location.href = 'auth.html';
    };

    window.addToCart = async () => {
      const name = document.getElementById('productName').value;
      const price = parseFloat(document.getElementById('productPrice').value);
      const qty = parseInt(document.getElementById('productQty').value);

      if (!name || !price || !qty) {
        alert('Please fill all fields');
        return;
      }

      try {
        await addDoc(collection(db, 'carts'), {
          userId: currentUser.uid,
          name,
          price,
          quantity: qty,
          addedAt: new Date()
        });
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productQty').value = '1';
        loadCart();
      } catch (error) {
        alert('Error adding to cart: ' + error.message);
      }
    };

    async function loadCart() {
      const q = query(collection(db, 'carts'), where('userId', '==', currentUser.uid));
      const querySnapshot = await getDocs(q);
      const container = document.getElementById('cartContainer');
      const summary = document.getElementById('summary');
      let total = 0;

      if (querySnapshot.empty) {
        container.innerHTML = '<div class="empty-message">Your cart is empty</div>';
        summary.style.display = 'none';
        return;
      }

      container.innerHTML = '';
      querySnapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">$${item.price.toFixed(2)} x ${item.quantity} = $${itemTotal.toFixed(2)}</div>
          </div>
          <div class="item-actions">
            <input type="number" class="quantity" value="${item.quantity}"
              onchange="updateQuantity('${docSnap.id}', this.value)">
            <button class="delete-btn" onclick="removeFromCart('${docSnap.id}')">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('totalPrice').textContent = total.toFixed(2);
      summary.style.display = 'block';
    }

    window.updateQuantity = async (id, qty) => {
      if (qty < 1) {
        removeFromCart(id);
        return;
      }
      try {
        const docRef = doc(db, 'carts', id);
        // For now, we'll delete and re-add with new quantity
        await deleteDoc(docRef);
        // Reload to update - in production you'd use updateDoc
        loadCart();
      } catch (error) {
        alert('Error updating cart: ' + error.message);
      }
    };

    window.removeFromCart = async (id) => {
      try {
        await deleteDoc(doc(db, 'carts', id));
        loadCart();
      } catch (error) {
        alert('Error removing item: ' + error.message);
      }
    };

    window.checkout = () => {
      alert('Thank you for your purchase! Order confirmation sent to your email.');
      // Clear cart
      querySnapshot.forEach(doc => deleteDoc(doc.ref));
      loadCart();
    };
  </script>
</body>
</html>
