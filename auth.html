<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vedam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #57131A 0%, #8B2635 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 400px; width: 100%; }
    .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: #57131A; font-size: 28px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    input:focus { outline: none; border-color: #57131A; }
    button {
      width: 100%;
      padding: 12px;
      background: #57131A;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #8B2635; }
    .toggle { text-align: center; margin-top: 20px; }
    .toggle a { color: #57131A; cursor: pointer; text-decoration: underline; }
    .error { color: #d32f2f; font-size: 14px; margin-top: 10px; }
    .success { color: #388e3c; font-size: 14px; margin-top: 10px; }
    .loading { display: none; text-align: center; }
    #loginForm { display: block; }
    #signupForm { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <h1>VEDAM</h1>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <h2 style="margin-bottom: 20px; color: #333;">Login</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit">Login</button>
        <div id="loginError" class="error"></div>
        <div class="toggle">
          Don't have an account? <a onclick="toggleForm()">Sign up</a>
        </div>
      </form>

      <!-- Signup Form -->
      <form id="signupForm">
        <h2 style="margin-bottom: 20px; color: #333;">Create Account</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" required>
        </div>
        <div class="form-group">
          <label>Password (min 6 characters)</label>
          <input type="password" id="signupPassword" required>
        </div>
        <button type="submit">Sign Up</button>
        <div id="signupError" class="error"></div>
        <div id="signupSuccess" class="success"></div>
        <div class="toggle">
          Already have an account? <a onclick="toggleForm()">Login</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from './firebase-config.js';

    function toggleForm() {
      document.getElementById('loginForm').style.display =
        document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('signupForm').style.display =
        document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
    }
    window.toggleForm = toggleForm;

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'index.html';
      } catch (error) {
        errorDiv.textContent = error.message;
      }
    });

    // Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const errorDiv = document.getElementById('signupError');
      const successDiv = document.getElementById('signupSuccess');

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        successDiv.textContent = 'Account created! Redirecting...';
        setTimeout(() => window.location.href = 'index.html', 2000);
      } catch (error) {
        errorDiv.textContent = error.message;
      }
    });
  </script>
</body>
</html>
