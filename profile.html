<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Vedam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .header {
      background: #57131A;
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 28px; }
    .nav-buttons { display: flex; gap: 10px; }
    .nav-btn {
      background: white;
      color: #57131A;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .nav-btn:hover { background: #eee; }
    .logout-btn { background: #d32f2f; color: white; }
    .logout-btn:hover { background: #b71c1c; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .card h2 { margin-bottom: 20px; color: #57131A; }
    .profile-info { display: grid; gap: 15px; }
    .info-row { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .label { font-weight: 600; color: #555; }
    .value { color: #333; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-primary {
      background: #57131A;
      color: white;
    }
    .btn-primary:hover { background: #8B2635; }
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover { background: #d0d0d0; }
    .empty-message {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .orders-list { display: grid; gap: 10px; }
    .order-item {
      padding: 15px;
      background: #f9f9f9;
      border-radius: 5px;
      border-left: 4px solid #57131A;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>My Account</h1>
    <div class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="cart.html" class="nav-btn">Cart</a>
      <button class="nav-btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Profile Information</h2>
      <div class="profile-info">
        <div class="info-row">
          <span class="label">Email:</span>
          <span class="value" id="userEmail">Loading...</span>
        </div>
        <div class="info-row">
          <span class="label">Account Created:</span>
          <span class="value" id="userCreated">Loading...</span>
        </div>
        <div class="info-row">
          <span class="label">Status:</span>
          <span class="value" style="color: #388e3c;">Active</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="editProfile()">Edit Profile</button>
        <button class="btn btn-secondary" onclick="changePassword()">Change Password</button>
      </div>
    </div>

    <div class="card">
      <h2>Recent Orders</h2>
      <div id="ordersContainer" class="empty-message">
        No orders yet
      </div>
    </div>

    <div class="card">
      <h2>Account Settings</h2>
      <div class="profile-info">
        <label>
          <input type="checkbox"> Receive promotional emails
        </label>
        <label>
          <input type="checkbox"> Receive order updates via SMS
        </label>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="deleteAccount()">Delete Account</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, signOut, onAuthStateChanged, collection, query, where, getDocs } from './firebase-config.js';

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'auth.html';
      } else {
        document.getElementById('userEmail').textContent = user.email;
        const created = new Date(user.metadata.creationTime).toLocaleDateString();
        document.getElementById('userCreated').textContent = created;
        loadOrders(user.uid);
      }
    });

    async function loadOrders(userId) {
      const q = query(collection(db, 'orders'), where('userId', '==', userId));
      const querySnapshot = await getDocs(q);
      const container = document.getElementById('ordersContainer');

      if (querySnapshot.empty) {
        container.innerHTML = '<div class="empty-message">No orders yet</div>';
        return;
      }

      container.innerHTML = '';
      querySnapshot.forEach((doc) => {
        const order = doc.data();
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `
          <strong>Order #${doc.id.slice(0, 8)}</strong><br>
          Total: $${order.total.toFixed(2)}<br>
          Date: ${new Date(order.date.seconds * 1000).toLocaleDateString()}
        `;
        container.appendChild(div);
      });
    }

    window.logout = async () => {
      await signOut(auth);
      window.location.href = 'auth.html';
    };

    window.editProfile = () => {
      alert('Edit profile feature coming soon!');
    };

    window.changePassword = () => {
      alert('Change password feature coming soon!');
    };

    window.deleteAccount = () => {
      if (confirm('Are you sure? This cannot be undone.')) {
        alert('Account deletion coming soon!');
      }
    };
  </script>
</body>
</html>
